<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>JOON GYRO LAB</title><link rel="stylesheet" href="style.css"></head><body>
<canvas id="scene" aria-label="오토바이 테스트 장면"></canvas>
<div class="hud"><div class="left"><span class="logo">JOON <b>GYRO LAB</b> <small>v0.1.3</small></span><div class="reading" id="lr">좌우 0.0°</div><div class="reading" id="fb">앞뒤 0.0°</div><div class="reading dim" id="raw">원시 센서 대기</div></div><div class="right"><span id="status" class="status">센서 시작 전</span><div class="speed"><strong id="speed">0</strong><span>km/h</span></div><div id="mode">신호 대기</div></div></div>
<div class="bottom"><span id="hint">휴대폰을 가로로 잡고 '센서 시작'을 눌러줘</span><div class="actions"><button id="start">센서 시작</button><button id="calibrate" disabled>중립 보정</button><button id="reset" disabled>재출발</button><button id="settings">설정</button></div></div>
<div id="rotate" class="rotate"><div>↻</div>휴대폰을 가로로 돌려줘<br><small>가로화면 센서 조작 테스트</small></div>
<dialog id="config"><form method="dialog"><header><strong>조작 설정 · v0.1.3</strong><button value="cancel" aria-label="닫기">✕</button></header><label>좌우 민감도 <output id="steerLabel">1.0</output><input id="steerSensitivity" type="range" min="0.2" max="1.5" value="0.6" step="0.1"></label><label>앞뒤 민감도 <output id="throttleLabel">1.0</output><input id="throttleSensitivity" type="range" min="0.2" max="1.5" value="0.6" step="0.1"></label><label>데드존 <output id="deadLabel">3°</output><input id="deadZone" type="range" min="2" max="10" value="5" step="1"></label><label class="check"><input id="invertSteer" type="checkbox">좌우 반전</label><label class="check"><input id="invertThrottle" type="checkbox">가속·감속 반전</label><p class="tip">센서 축은 실제 아이폰의 방향에 따라 달라질 수 있어. 테스트하면서 반전 설정을 조절해줘. 중립 보정은 편안한 주행 자세에서 누르면 돼.</p><button class="close" value="ok">완료</button></form></dialog>
<script src="app.js"></script></body></html>
